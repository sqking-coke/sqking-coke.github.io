<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#78350f"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="iconG3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#fcd34d"/>
    </linearGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#bg3)"/>
  <rect width="800" height="400" fill="url(#grid3)"/>
  <!-- Clipboard / ticket icon -->
  <rect x="300" y="110" width="160" height="200" rx="10" fill="none" stroke="url(#iconG3)" stroke-width="2.5"/>
  <rect x="330" y="90" width="100" height="40" rx="6" fill="none" stroke="url(#iconG3)" stroke-width="2.5"/>
  <!-- Lines on clipboard -->
  <line x1="330" y1="150" x2="430" y2="150" stroke="url(#iconG3)" stroke-width="1.5" opacity="0.4"/>
  <line x1="330" y1="175" x2="430" y2="175" stroke="url(#iconG3)" stroke-width="1.5" opacity="0.4"/>
  <line x1="330" y1="200" x2="400" y2="200" stroke="url(#iconG3)" stroke-width="1.5" opacity="0.4"/>
  <line x1="330" y1="225" x2="420" y2="225" stroke="url(#iconG3)" stroke-width="1.5" opacity="0.4"/>
  <line x1="330" y1="250" x2="380" y2="250" stroke="url(#iconG3)" stroke-width="1.5" opacity="0.4"/>
  <!-- Checkmark on clipboard -->
  <circle cx="430" cy="270" r="22" fill="#f59e0b" stroke="#fcd34d" stroke-width="2"/>
  <polyline points="421,270 427,277 440,262" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Flow arrows decoration -->
  <path d="M120 180 L160 180 L170 160 L200 160" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <path d="M600 200 L630 200 L640 180 L670 180" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <defs><marker id="arrow3" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="rgba(255,255,255,0.15)"/></marker></defs>
  <circle cx="150" cy="300" r="2" fill="rgba(255,255,255,0.1)"/>
  <circle cx="670" cy="100" r="2" fill="rgba(255,255,255,0.08)"/>
  <!-- Text -->
  <text x="400" y="340" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Work Order Agent</text>
  <text x="400" y="370" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="rgba(255,255,255,0.5)">Classification + Entity Extraction + Auto Assignment + Knowledge Q&amp;A</text>
  <rect x="350" y="385" width="100" height="3" rx="1.5" fill="url(#iconG3)" opacity="0.6"/>
</svg>
