<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#312e81"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="iconG5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#a5b4fc"/>
    </linearGradient>
    <pattern id="grid5" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#bg5)"/>
  <rect width="800" height="400" fill="url(#grid5)"/>
  <!-- Central orchestrator node -->
  <circle cx="400" cy="150" r="48" fill="none" stroke="url(#iconG5)" stroke-width="2.5"/>
  <text x="400" y="157" text-anchor="middle" font-family="monospace" font-size="22" font-weight="700" fill="#a5b4fc">调度</text>
  <!-- Surrounding agent nodes -->
  <circle cx="250" cy="110" r="28" fill="none" stroke="url(#iconG5)" stroke-width="1.8" opacity="0.7"/>
  <text x="250" y="116" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.5)">数据</text>
  <circle cx="550" cy="110" r="28" fill="none" stroke="url(#iconG5)" stroke-width="1.8" opacity="0.7"/>
  <text x="550" y="116" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.5)">文案</text>
  <circle cx="300" cy="195" r="28" fill="none" stroke="url(#iconG5)" stroke-width="1.8" opacity="0.7"/>
  <text x="300" y="201" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.5)">审批</text>
  <circle cx="500" cy="195" r="28" fill="none" stroke="url(#iconG5)" stroke-width="1.8" opacity="0.7"/>
  <text x="500" y="201" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.5)">检索</text>
  <!-- Connection lines -->
  <line x1="278" y1="110" x2="352" y2="150" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <line x1="522" y1="110" x2="448" y2="150" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <line x1="328" y1="195" x2="352" y2="150" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <line x1="472" y1="195" x2="448" y2="150" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <!-- Planning badge -->
  <rect x="340" y="235" width="120" height="28" rx="14" fill="rgba(99,102,241,0.3)" stroke="#818cf8" stroke-width="1"/>
  <text x="400" y="254" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#c7d2fe">🔨 规划中</text>
  <!-- Text -->
  <text x="400" y="315" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="700" fill="#ffffff">Multi-Agent Collaboration System</text>
  <text x="400" y="350" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="rgba(255,255,255,0.5)">Orchestrator + DAG Scheduling + Pluggable Agent Registry</text>
  <rect x="350" y="375" width="100" height="3" rx="1.5" fill="url(#iconG5)" opacity="0.6"/>
</svg>
