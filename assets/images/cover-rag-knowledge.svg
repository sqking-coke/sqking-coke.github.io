<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#134e4a"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
    <linearGradient id="iconG6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2dd4bf"/>
      <stop offset="100%" style="stop-color:#5eead4"/>
    </linearGradient>
    <pattern id="grid6" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#bg6)"/>
  <rect width="800" height="400" fill="url(#grid6)"/>
  <!-- Book / document icon -->
  <path d="M310 110 L310 250 L380 240 L380 100 Z" fill="none" stroke="url(#iconG6)" stroke-width="2.5"/>
  <path d="M380 100 L380 240 L450 250 L450 110 Z" fill="none" stroke="url(#iconG6)" stroke-width="2.5"/>
  <line x1="340" y1="140" x2="420" y2="135" stroke="url(#iconG6)" stroke-width="1" opacity="0.3"/>
  <line x1="340" y1="165" x2="420" y2="160" stroke="url(#iconG6)" stroke-width="1" opacity="0.3"/>
  <line x1="340" y1="190" x2="400" y2="186" stroke="url(#iconG6)" stroke-width="1" opacity="0.3"/>
  <!-- RAG pipeline arrows -->
  <path d="M120 250 L155 250 L160 220" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <circle cx="160" cy="215" r="4" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <path d="M500 200 L530 200 L540 230 L570 230" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <!-- Search / magnifier -->
  <circle cx="170" cy="270" r="22" fill="none" stroke="url(#iconG6)" stroke-width="2" opacity="0.6"/>
  <line x1="186" y1="286" x2="205" y2="305" stroke="url(#iconG6)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Database cylinder small -->
  <ellipse cx="600" cy="250" rx="30" ry="8" fill="none" stroke="url(#iconG6)" stroke-width="1.5" opacity="0.5"/>
  <path d="M570 250 L570 280 A30 8 0 0 0 630 280 L630 250" fill="none" stroke="url(#iconG6)" stroke-width="1.5" opacity="0.5"/>
  <!-- Lock icon (privacy) -->
  <rect x="618" y="265" width="16" height="13" rx="3" fill="none" stroke="url(#iconG6)" stroke-width="2" opacity="0.6"/>
  <path d="M622 265 L622 258 A4 4 0 0 1 630 258 L630 265" fill="none" stroke="url(#iconG6)" stroke-width="2" opacity="0.6"/>
  <!-- Planning badge -->
  <rect x="340" y="275" width="120" height="28" rx="14" fill="rgba(13,148,136,0.3)" stroke="#2dd4bf" stroke-width="1"/>
  <text x="400" y="294" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#99f6e4">🔨 规划中</text>
  <!-- Text -->
  <text x="400" y="355" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="700" fill="#ffffff">Local Private RAG Knowledge Base</text>
  <text x="400" y="385" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="rgba(255,255,255,0.5)">Full RAG Pipeline + Hybrid Search + Ollama Local Deployment</text>
  <rect x="350" y="395" width="100" height="3" rx="1.5" fill="url(#iconG6)" opacity="0.6"/>
</svg>
