<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#134e4a"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
    <linearGradient id="iconG6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2dd4bf"/>
      <stop offset="100%" style="stop-color:#5eead4"/>
    </linearGradient>
    <pattern id="grid6" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#bg6)"/>
  <rect width="800" height="400" fill="url(#grid6)"/>

  <!-- Brain / knowledge network - central concept graph -->
  <!-- Central node -->
  <circle cx="400" cy="120" r="10" fill="#2dd4bf" opacity="0.9"/>
  <!-- Connected nodes around center -->
  <circle cx="350" cy="90" r="6" fill="#5eead4" opacity="0.7"/>
  <circle cx="450" cy="85" r="7" fill="#5eead4" opacity="0.6"/>
  <circle cx="480" cy="120" r="5" fill="#5eead4" opacity="0.7"/>
  <circle cx="440" cy="155" r="6" fill="#5eead4" opacity="0.5"/>
  <circle cx="360" cy="155" r="5" fill="#5eead4" opacity="0.65"/>
  <circle cx="310" cy="120" r="6" fill="#5eead4" opacity="0.55"/>
  <circle cx="400" cy="70" r="5" fill="#5eead4" opacity="0.5"/>
  <circle cx="330" cy="65" r="5" fill="#5eead4" opacity="0.4"/>
  <circle cx="470" cy="65" r="6" fill="#5eead4" opacity="0.45"/>
  <circle cx="500" cy="100" r="4" fill="#5eead4" opacity="0.5"/>
  <circle cx="300" cy="100" r="4" fill="#5eead4" opacity="0.45"/>

  <!-- Connection edges -->
  <line x1="400" y1="120" x2="350" y2="90" stroke="rgba(45,212,191,0.25)" stroke-width="1"/>
  <line x1="400" y1="120" x2="450" y2="85" stroke="rgba(45,212,191,0.25)" stroke-width="1"/>
  <line x1="400" y1="120" x2="480" y2="120" stroke="rgba(45,212,191,0.25)" stroke-width="1"/>
  <line x1="400" y1="120" x2="440" y2="155" stroke="rgba(45,212,191,0.25)" stroke-width="1"/>
  <line x1="400" y1="120" x2="360" y2="155" stroke="rgba(45,212,191,0.25)" stroke-width="1"/>
  <line x1="400" y1="120" x2="310" y2="120" stroke="rgba(45,212,191,0.25)" stroke-width="1"/>
  <line x1="350" y1="90" x2="330" y2="65" stroke="rgba(45,212,191,0.18)" stroke-width="1"/>
  <line x1="450" y1="85" x2="470" y2="65" stroke="rgba(45,212,191,0.18)" stroke-width="1"/>
  <line x1="450" y1="85" x2="500" y2="100" stroke="rgba(45,212,191,0.18)" stroke-width="1"/>
  <line x1="350" y1="90" x2="300" y2="100" stroke="rgba(45,212,191,0.18)" stroke-width="1"/>
  <line x1="440" y1="155" x2="480" y2="120" stroke="rgba(45,212,191,0.18)" stroke-width="1"/>
  <line x1="360" y1="155" x2="310" y2="120" stroke="rgba(45,212,191,0.18)" stroke-width="1"/>
  <line x1="330" y1="65" x2="400" y2="70" stroke="rgba(45,212,191,0.15)" stroke-width="0.8"/>
  <line x1="470" y1="65" x2="400" y2="70" stroke="rgba(45,212,191,0.15)" stroke-width="0.8"/>

  <!-- Left side: Document stack (input) -->
  <rect x="110" y="100" width="50" height="65" rx="3" fill="none" stroke="#2dd4bf" stroke-width="1.8" opacity="0.6"/>
  <rect x="118" y="108" width="50" height="65" rx="3" fill="none" stroke="#2dd4bf" stroke-width="1.8" opacity="0.45"/>
  <rect x="126" y="116" width="50" height="65" rx="3" fill="none" stroke="#2dd4bf" stroke-width="1.8" opacity="0.3"/>
  <!-- Document lines -->
  <line x1="134" y1="132" x2="160" y2="130" stroke="#2dd4bf" stroke-width="1" opacity="0.25"/>
  <line x1="134" y1="145" x2="158" y2="143" stroke="#2dd4bf" stroke-width="1" opacity="0.2"/>
  <line x1="134" y1="158" x2="152" y2="156" stroke="#2dd4bf" stroke-width="1" opacity="0.15"/>

  <!-- Arrow from docs to network (pipeline input) -->
  <path d="M178 145 L230 145" stroke="rgba(45,212,191,0.3)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="235,140 245,145 235,150" fill="rgba(45,212,191,0.3)"/>

  <!-- Right side: Search/QA output -->
  <circle cx="640" cy="130" r="22" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.55"/>
  <line x1="656" y1="146" x2="672" y2="162" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>

  <!-- Answer lines floating right -->
  <rect x="610" y="175" width="60" height="4" rx="2" fill="rgba(45,212,191,0.2)"/>
  <rect x="615" y="185" width="45" height="4" rx="2" fill="rgba(45,212,191,0.15)"/>
  <rect x="615" y="195" width="52" height="4" rx="2" fill="rgba(45,212,191,0.12)"/>

  <!-- Arrow from network to output -->
  <path d="M555 130 L605 130" stroke="rgba(45,212,191,0.3)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="610,125 620,130 610,135" fill="rgba(45,212,191,0.3)"/>

  <!-- Citation badge -->
  <rect x="590" y="210" width="70" height="18" rx="9" fill="rgba(13,148,136,0.25)" stroke="#2dd4bf" stroke-width="0.8" opacity="0.5"/>
  <text x="625" y="223" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(94,234,212,0.5)">📎 来源追溯</text>

  <!-- Obsidian import hint -->
  <rect x="100" y="210" width="80" height="18" rx="9" fill="rgba(13,148,136,0.25)" stroke="#2dd4bf" stroke-width="0.8" opacity="0.5"/>
  <text x="140" y="223" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(94,234,212,0.5)">📥 Obsidian</text>

  <!-- Decorative dots -->
  <circle cx="80" cy="160" r="2" fill="rgba(255,255,255,0.08)"/>
  <circle cx="720" cy="100" r="2.5" fill="rgba(255,255,255,0.06)"/>
  <circle cx="150" cy="310" r="1.5" fill="rgba(255,255,255,0.08)"/>

  <!-- Title text -->
  <text x="400" y="295" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="700" fill="#ffffff">mindvaults — Local Private RAG</text>
  <text x="400" y="330" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="rgba(255,255,255,0.5)">Next.js + FastAPI + PostgreSQL/pgvector + Ollama</text>

  <!-- Bottom accent line -->
  <rect x="350" y="360" width="100" height="3" rx="1.5" fill="url(#iconG6)" opacity="0.6"/>
</svg>
