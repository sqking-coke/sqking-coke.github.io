<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="iconG1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#93c5fd"/>
    </linearGradient>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#bg1)"/>
  <rect width="800" height="400" fill="url(#grid1)"/>
  <!-- Database cylinder -->
  <ellipse cx="340" cy="135" rx="70" ry="18" fill="none" stroke="url(#iconG1)" stroke-width="3"/>
  <path d="M270 135 L270 210 A70 18 0 0 0 410 210 L410 135" fill="none" stroke="url(#iconG1)" stroke-width="3"/>
  <path d="M270 170 A70 18 0 0 0 410 170" fill="none" stroke="url(#iconG1)" stroke-width="1.5" opacity="0.5"/>
  <!-- Magnifying glass -->
  <circle cx="460" cy="200" r="35" fill="none" stroke="url(#iconG1)" stroke-width="3"/>
  <line x1="485" y1="225" x2="510" y2="250" stroke="url(#iconG1)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Decorative dots -->
  <circle cx="150" cy="300" r="2" fill="rgba(255,255,255,0.1)"/>
  <circle cx="650" cy="100" r="3" fill="rgba(255,255,255,0.08)"/>
  <circle cx="700" cy="320" r="2" fill="rgba(255,255,255,0.1)"/>
  <!-- Text -->
  <text x="400" y="300" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="36" font-weight="700" fill="#ffffff">AI Data Query Agent</text>
  <text x="400" y="335" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="rgba(255,255,255,0.5)">LLM + Tool Calling + Task Orchestration</text>
  <!-- Bottom accent line -->
  <rect x="350" y="360" width="100" height="3" rx="1.5" fill="url(#iconG1)" opacity="0.6"/>
</svg>
