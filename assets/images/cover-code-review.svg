<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e1065"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="iconG4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#c4b5fd"/>
    </linearGradient>
    <pattern id="grid4" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#bg4)"/>
  <rect width="800" height="400" fill="url(#grid4)"/>
  <!-- Code brackets -->
  <text x="280" y="190" font-family="monospace" font-size="90" font-weight="700" fill="url(#iconG4)" opacity="0.8">&lt;/</text>
  <text x="430" y="190" font-family="monospace" font-size="90" font-weight="700" fill="url(#iconG4)" opacity="0.8">&gt;</text>
  <!-- Shield / security -->
  <path d="M400 115 L340 145 L340 205 Q340 245 400 265 Q460 245 460 205 L460 145 Z" fill="none" stroke="url(#iconG4)" stroke-width="2.5" opacity="0.5"/>
  <polyline points="387,200 397,210 418,185" fill="none" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Code lines decoration -->
  <rect x="100" y="150" width="120" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>
  <rect x="100" y="165" width="80" height="4" rx="2" fill="rgba(255,255,255,0.06)"/>
  <rect x="100" y="180" width="100" height="4" rx="2" fill="rgba(255,255,255,0.07)"/>
  <rect x="580" y="150" width="120" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>
  <rect x="580" y="165" width="90" height="4" rx="2" fill="rgba(255,255,255,0.06)"/>
  <rect x="580" y="180" width="110" height="4" rx="2" fill="rgba(255,255,255,0.07)"/>
  <!-- Dots -->
  <circle cx="150" cy="320" r="2" fill="rgba(255,255,255,0.1)"/>
  <circle cx="660" cy="300" r="2" fill="rgba(255,255,255,0.08)"/>
  <!-- Text -->
  <text x="400" y="330" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="36" font-weight="700" fill="#ffffff">Code Review Agent</text>
  <text x="400" y="360" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="rgba(255,255,255,0.5)">Syntax + Semantic + RAG + Vulnerability + Performance + Report</text>
  <rect x="350" y="380" width="100" height="3" rx="1.5" fill="url(#iconG4)" opacity="0.6"/>
</svg>
