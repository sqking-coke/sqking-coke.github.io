<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#064e3b"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <linearGradient id="iconG2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#6ee7b7"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#bg2)"/>
  <rect width="800" height="400" fill="url(#grid2)"/>
  <!-- API endpoint icon -->
  <rect x="280" y="120" width="240" height="100" rx="12" fill="none" stroke="url(#iconG2)" stroke-width="2.5"/>
  <line x1="300" y1="147" x2="500" y2="147" stroke="url(#iconG2)" stroke-width="1" opacity="0.4"/>
  <line x1="300" y1="167" x2="480" y2="167" stroke="url(#iconG2)" stroke-width="1" opacity="0.4"/>
  <line x1="300" y1="187" x2="460" y2="187" stroke="url(#iconG2)" stroke-width="1" opacity="0.4"/>
  <text x="300" y="143" font-family="monospace" font-size="13" fill="#6ee7b7">GET</text>
  <text x="345" y="143" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.6)">/api/v1/inspect</text>
  <!-- Checkmark badge -->
  <circle cx="530" cy="130" r="18" fill="#10b981" stroke="#6ee7b7" stroke-width="2"/>
  <polyline points="521,130 527,137 539,123" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Circuit lines decoration -->
  <path d="M100 200 L130 200 L140 180" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <circle cx="140" cy="180" r="3" fill="rgba(255,255,255,0.15)"/>
  <path d="M680 180 L660 180 L650 200 L630 200" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <circle cx="630" cy="200" r="3" fill="rgba(255,255,255,0.15)"/>
  <circle cx="150" cy="300" r="2" fill="rgba(255,255,255,0.1)"/>
  <circle cx="670" cy="100" r="2" fill="rgba(255,255,255,0.08)"/>
  <!-- Text -->
  <text x="400" y="300" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="36" font-weight="700" fill="#ffffff">API Inspection Agent</text>
  <text x="400" y="335" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="rgba(255,255,255,0.5)">Batch Call + Smart Assertion + Root Cause Analysis</text>
  <rect x="350" y="360" width="100" height="3" rx="1.5" fill="url(#iconG2)" opacity="0.6"/>
</svg>
